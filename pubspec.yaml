name: offline_nail_demo
description: Offline nail and makeup try-on for Android and iOS.
publish_to: none
version: 0.19.1+32
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.2
  image_picker: 1.2.4
  image: 4.12.0
  path_provider: 2.1.6
  flutter_onnxruntime: 1.9.0
  share_plus: 13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  camera_platform_interface: 2.15.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/branding/logo.jpg
    - assets/licenses/
    - assets/models/MEDIAPIPE_LICENSE.txt
    - assets/models/hand_landmarker.task
    - assets/models/face_landmarker.task
    - assets/models/nail_segmentation.onnx
    - assets/samples/hand.jpg
    - assets/samples/beauty_face.png
  shaders:
    - shaders/nail.frag
